# The official khLink service: its relay, account login and update key.
# build.gradle.kts turns these into BuildConfig fields. The open-source code
# ships it too, so every build offers the official service (khLink account,
# membership required) besides a self-hosted relay. A build without this file
# has no default relay, accepts any https relay the user enters or scans, has
# no update channel and leads with the self-hosted password login.

# The relay moved from 45.59.131.115, which is not reachable from China without
# a VPN, to khsci.vip on 2026-10-28; the old host only forwards there.
bridgeServer=https://khsci.vip/fengzhu-bridge

# A saved address here (0.1.2xx before 0.1.269) is read as bridgeServer: same
# relay, same accounts and sessions. The signed update manifest also names its
# packages on 115, and the phone fetches them through bridgeServer.
legacyBridgeServers=https://45.59.131.115/fengzhu-bridge,https://www.khsci.vip/fengzhu-bridge

# Relays the app accepts from a QR code or login. Connectors keep 115, so their
# QR codes still name it.
trustedBridgeServers=https://khsci.vip/,https://45.59.131.115/

# Offer khLink account login on the official relay (accounts and membership
# from khsci.com). Without it the login page leads with a self-hosted relay's
# password login (v1).
accountLogin=true

# Ed25519 public key of releases/update-manifest.sig.
updatePublicKey=ooVsYkdIQc9U6n0kBXlFxxMUaFnrb1VbVs5zeHf6Lr0=

# Where else the signed update manifest is published, in order: GitHub
# Releases, then jsDelivr's Gcore, Fastly and default endpoints; the relay's
# /downloads is always the last fallback. Comma-separated; empty: relay only.
updateMirrors=https://github.com/khscience/khlink-releases/releases/latest/download,https://gcore.jsdelivr.net/gh/khscience/khlink-releases@dist,https://fastly.jsdelivr.net/gh/khscience/khlink-releases@dist,https://cdn.jsdelivr.net/gh/khscience/khlink-releases@dist
