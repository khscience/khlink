[package]
name = "kh-link-desktop"
version = "0.1.42"
edition = "2024"
license = "Proprietary"

[lib]
name = "kh_link_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "6"
ed25519-dalek = "2"
hostname = "0.4"
open = "5"
qrcode = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
url = "2"
winreg = "0.55"
x25519-dalek = { version = "2", features = ["static_secrets"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
