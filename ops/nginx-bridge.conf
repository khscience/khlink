limit_req_zone $binary_remote_addr zone=fengzhu_bridge_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name khsci.vip;
    merge_slashes on;

    location /fengzhu-bridge/downloads/ {
        alias /var/www/fengzhu-agent-bridge/;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    location /fengzhu-bridge/api/v1/auth/ {
        limit_req zone=fengzhu_bridge_auth burst=5 nodelay;
        # Replace only the public prefix with the backend auth prefix.  A
        # plain trailing-slash proxy_pass here strips the entire auth
        # location and forwards only /challenge or /login, while omitting
        # the URI forwards /fengzhu-bridge/... unchanged.  Both produce a
        # 404; this explicit prefix preserves /api/v1/auth/... exactly.
        proxy_pass http://127.0.0.1:8110/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Keep sensitive v2 endpoints rate-limited at the edge. Exact proxy paths
    # preserve the /api/v2 prefix after Nginx removes /fengzhu-bridge.
    location = /fengzhu-bridge/api/v2/session/refresh {
        limit_req zone=fengzhu_bridge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8110/api/v2/session/refresh;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /fengzhu-bridge/api/v2/session/oauth/authorization {
        limit_req zone=fengzhu_bridge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8110/api/v2/session/oauth/authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /fengzhu-bridge/api/v2/session/oauth/complete {
        limit_req zone=fengzhu_bridge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8110/api/v2/session/oauth/complete;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /fengzhu-bridge/api/v2/pairing/claim {
        limit_req zone=fengzhu_bridge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8110/api/v2/pairing/claim;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /fengzhu-bridge/ {
        proxy_pass http://127.0.0.1:8110/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        # Encrypted history items can contain Codex imageGeneration base64
        # payloads. Allow a bounded multi-megabyte sync while the application
        # still enforces its own 12 MB JSON parser limit.
        client_max_body_size 15m;
    }
}
